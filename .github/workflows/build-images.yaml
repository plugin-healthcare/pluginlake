# Reusable: builds the four images without pushing and scans them with Trivy.
# Called by images.yaml; the caller decides the permissions and the scan mode.
name: Build images

on:
  workflow_call:
    inputs:
      report:
        description: "Upload all fixable HIGH/CRITICAL findings to the Security tab instead of failing on CRITICAL."
        type: boolean
        required: true
    secrets:
      DHI_USERNAME:
        required: false
      DHI_TOKEN:
        required: false

# No permissions here: the job inherits them from the calling job in images.yaml
# (contents: read for pull requests, plus security-events: write for the report).

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: deploy/docker/api.Dockerfile
          - image: dagster-webserver
            dockerfile: deploy/docker/dagster-webserver.Dockerfile
          - image: ui-central
            dockerfile: deploy/docker/ui.Dockerfile
            build_args: |
              APP=central
              PORT=8502
          - image: ui-datastation
            dockerfile: deploy/docker/ui.Dockerfile
            build_args: |
              APP=datastation
              PORT=8501
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # The base images come from Docker Hardened Images (dhi.io), which needs a Docker account.
      - name: Log in to dhi.io
        uses: docker/login-action@v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: pluginlake/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Fail on critical vulnerabilities with a fix
        if: ${{ !inputs.report }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: pluginlake/${{ matrix.image }}:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan for the Security tab
        if: ${{ inputs.report }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: pluginlake/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload findings to the Security tab
        if: ${{ inputs.report }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
