name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group lint --extra fhir

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ty check
        run: uv run ty check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group test --extra fhir

      - name: Run tests
        run: uv run pytest --cov=pluginlake
