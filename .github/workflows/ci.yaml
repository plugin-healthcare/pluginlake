name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Ruff and ty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --group lint

      # --no-fix: report instead of silently fixing (pyproject sets fix = true for local use).
      - name: Ruff check
        run: uv run ruff check --no-fix .

      - name: Ruff format
        run: uv run ruff format --check .

      # Warnings fail too ([tool.ty.terminal] error-on-warning).
      - name: ty check
        run: uv run ty check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Run tests
        run: uv run pytest --cov=pluginlake

  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        run: uv build

      # The CLI and the production stack must work from the wheel alone, without a checkout.
      - name: CLI runs from the installed wheel
        run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel/bin/python dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/wheel/bin/pluginlake --help > /dev/null
          /tmp/wheel/bin/python - <<'PY'
          from pluginlake.deploy.images import PROD_COMPOSE_FILE, STACK_DIR, load_image_lock
          for path in (PROD_COMPOSE_FILE, STACK_DIR / "images.json", STACK_DIR / "marquez" / "marquez.yml",
                       STACK_DIR / "monitoring" / "prometheus" / "entrypoint.sh",
                       STACK_DIR / "templates" / "env.production.example"):
              assert path.is_file(), path
          assert load_image_lock().is_empty
          PY
          # Unreleased build: the production stack must refuse with a clear message.
          printf '[station]\n' > pluginlake.toml
          if /tmp/wheel/bin/pluginlake up 2> err.txt; then exit 1; fi
          grep -q "no released images" err.txt
