[project]
name = "pluginlake"
version = "0.1.0"
description = "The federated lakehouse."
license = { text = "MIT" }
authors = [
    { name = "Yannick Vinkesteijn" },
    { name = "Tim Hendriks" },
    { name = "Marlou van de Sande" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "dagster>=1.12.14",
    "duckdb>=1.4.4",
    "fastapi>=0.128.7",
    "httpx>=0.28.0",
    "marimo>=0.20.2",
    "polars>=1.38.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.1",  # Required by DuckDB for Polars DataFrame registration
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",
    "python-multipart>=0.0.18",
]

[project.urls]
Homepage = "https://github.com/plugin-healthcare/pluginlake"
Repository = "https://github.com/plugin-healthcare/pluginlake"
Issues = "https://github.com/plugin-healthcare/pluginlake/issues"
Documentation = "https://github.com/plugin-healthcare/pluginlake#readme"

[project.optional-dependencies]
infra = [
    "dagster-graphql>=1.12.14",
    "dagster-postgres>=0.28.14",
    "dagster-webserver>=1.12.14",
]
azure = [
    "azure-identity>=1.25.2",
    "azure-storage-blob>=12.28.0",
]
synthea = [
    "boto3>=1.42.45",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.12.14",
    "pre-commit>=4.5.1",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "security" },
    { include-group = "docs" },
    { include-group = "nb" },
]
lint = [
    "ruff>=0.15.0",
    "ty>=0.0.15",
]
security = [
    "uv-secure>=0.15.4",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]
docs = [
    "mkdocstrings[python]>=1.0.3",
    "zensical>=0.0.21",
]
nb = [
    "marimo>=0.19.9",
    "pyzmq>=27.1.0",
]
dashboard = [
    "streamlit[starlette]>=1.53.0",
    "httpx>=0.28.0",
    "plotly>=6.1.0",
    "pydantic-settings>=2.9.1",
]

# --- Tool Configuration ---

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
# Skip non-source directories
exclude = [
    "examples/",
    "docs/",
    "scripts/",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing — conflicts with ruff formatter
    "ISC001",  # Implicit string concat on single line — conflicts with ruff formatter
    "D203",    # One blank line before class docstring — conflicts with D211
    "D213",    # Multi-line docstring summary on second line — conflicts with D212
    "E501",    # Line length regulated by formatter
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link on the line following this TODO
    "TRY003",  # Avoid specifying long messages outside the exception class
    "SIM102",  # Use a single if statement instead of nested if statements
    "SIM108",  # Use ternary operator
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pluginlake"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "S608",    # SQL injection — test assertions use f-strings with constants
    "D100",    # Missing docstring in public module
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "ANN",     # Type annotations (pytest fixtures are dynamic)
    "INP001",  # implicit namespace package (need __init__.py for test discovery)
    "PLR2004", # Magic values acceptable in test assertions
    "PLR0913", # Many fixture arguments acceptable in test fixtures
    "SLF001",  # Private member access (testing internals)
    "ARG001",  # Unused function argument (fixtures for side effects)
    "PLC0415", # Inline imports (scoped test helpers)
    "ASYNC240",# pathlib in async tests (sync assertions are fine)
]
"notebooks/*.py" = [
    "INP001",  # Implicit namespace package
    "E402",    # Module level import not at top of file
    "F401",    # Imported but unused
    "F403",    # 'from module import *' used
    "T201",    # print() statements
    "S101",    # Use of assert
    "D100",    # Missing docstring in public module
    "D103",    # Missing docstring in public function
    "ANN",     # Type annotations
    "EM102",   # Exception must not use an f-string literal
    "PLC0415", # import not at top-level (marimo cells use inline imports)
    "N803",    # Argument name should be lowercase (marimo passes module refs)
    "N806",    # Variable should be lowercase (constants in notebook cells)
    "PLR0913", # Too many arguments (marimo cell dependency injection)
    "ARG001",  # Unused function argument (marimo dependency ordering)
]
"src/pluginlake/omop/queries.py" = [
    "PLR0913", # Too many arguments acceptable for filter functions with optional criteria
    "S608",    # SQL queries use parameterized values with ? placeholders; string concatenation for structure only
]
"notebooks/**/*.py" = [
    "N807",    # Marimo uses __ for anonymous cell functions
    "D415",    # First line ending with period not required for notebooks
    "W293",    # Blank line whitespace from marimo formatting
    "DTZ005",  # datetime.now() without tz acceptable for age calculation in notebooks
]
"src/pluginlake-ui/**/*.py" = [
    "INP001",  # Implicit namespace package (no __init__.py in Streamlit apps)
    "T201",    # print() statements acceptable in dashboard scripts
    "D100",    # Missing docstring in public module
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "S101",    # Use of assert
    "ANN401",  # HTTP client _get returns response.json() which is inherently Any
]
"src/pluginlake/api/routers/catalog.py" = [
    "S608",    # SQL queries use validated identifiers; cannot parameterise schema/table names
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.ty]

[tool.ty.src]
exclude = [
    "external_repos/",
    "notebooks/",
    "src/pluginlake-ui/",  # Streamlit modifies sys.path at runtime; ty cannot resolve cross-module imports
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "warn"
invalid-return-type = "error"
invalid-argument-type = "error"
division-by-zero = "error"
redundant-cast = "warn"
invalid-method-override = "warn"

[tool.uv-secure.maintainability_criteria]
forbid_yanked = true
forbid_archived = true
forbid_quarantined = true
