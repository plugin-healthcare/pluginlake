# Folders and secrets that `pluginlake setup` creates below PLUGINLAKE_HOME.
# `services` lists the compose services that mount the secret; a test keeps it equal to docker-compose.yaml.
# Kinds: hex, base64, password, empty, template ({name} is replaced by the quoted value of an earlier secret).

folders = ["postgres", "data", "prometheus", "marquez-db"]
private_folders = ["bootstrap"]
secrets_folder = "secrets"

[[secrets]]
name = "postgres_password"
kind = "hex"
services = ["postgres", "pluginlake-db-init"]

[[secrets]]
name = "dagster_pg_password"
kind = "hex"
services = ["pluginlake-db-init", "dagster-webserver", "dagster-daemon", "dagster-code-server"]

[[secrets]]
name = "ducklake_pg_password"
kind = "hex"
services = ["pluginlake-db-init", "dagster-code-server", "pluginlake"]

[[secrets]]
name = "postgres_exporter_password"
kind = "hex"
services = ["pluginlake-db-init", "postgres-exporter"]

[[secrets]]
name = "prometheus_remote_write_password"
kind = "empty"
services = ["prometheus"]

[[secrets]]
name = "marquez_db_password"
kind = "hex"
services = ["marquez-db", "marquez"]

[[secrets]]
name = "zitadel_db_password"
kind = "hex"
services = ["pluginlake-db-init"]

[[secrets]]
name = "zitadel_masterkey"
kind = "hex"
services = ["zitadel-api"]

[[secrets]]
name = "zitadel_cookie_secret"
kind = "base64"
services = ["zitadel-login"]

[[secrets]]
name = "zitadel_admin_password"
kind = "password"
services = []

[[secrets]]
name = "zitadel_config.yaml"
kind = "template"
template = "Database:\n  Postgres:\n    User:\n      Password: {zitadel_db_password}\n"
services = ["zitadel-init", "zitadel-api"]

[[secrets]]
name = "zitadel_steps.yaml"
kind = "template"
template = "FirstInstance:\n  Org:\n    Human:\n      Password: {zitadel_admin_password}\n"
services = ["zitadel-api"]
