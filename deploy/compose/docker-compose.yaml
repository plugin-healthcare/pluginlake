services:
  postgres:
    image: dhi.io/postgres:17-alpine3.22
    env_file: .env.production
    ports:
      - "5432:5432"
    volumes:
      - dagster-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  dagster-webserver:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      DAGSTER_HOME: /app/config/dagster
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command:
      [
        "dagster-webserver",
        "-h", "0.0.0.0",
        "-p", "3000",
        "-w", "/app/config/dagster/workspace.yaml",
      ]

  dagster-daemon:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    env_file: .env.production
    environment:
      DAGSTER_HOME: /app/config/dagster
    volumes:
      - dagster-compute-logs:/app/compute_logs
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command: ["dagster-daemon", "run"]

  dagster-code-server:
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    ports:
      - "4000:4000"
    env_file: .env.production
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    volumes:
      - pluginlake-data:/app/.data
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 3s
      timeout: 3s
      start_period: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "dagster", "code-server", "start",
        "-h", "0.0.0.0",
        "-p", "4000",
        "-m", "pluginlake.definitions",
      ]

  pluginlake:
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    env_file: .env.production
    environment:
      PLUGINLAKE_SERVER_HOST: ${PLUGINLAKE_SERVER_HOST:-0.0.0.0}
      PLUGINLAKE_SERVER_PORT: ${PLUGINLAKE_SERVER_PORT:-8000}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_INGEST_DAGSTER_WEBSERVER_URL: http://dagster-webserver:3000
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
      PLUGINLAKE_METRICS_HOST: "0.0.0.0"
    ports:
      - "${PLUGINLAKE_SERVER_PORT:-8000}:${PLUGINLAKE_SERVER_PORT:-8000}"
    expose:
      # Internal metrics port (PLUGINLAKE_METRICS_PORT): scraped by Prometheus, never published.
      - "9464"
    volumes:
      - pluginlake-data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PLUGINLAKE_SERVER_PORT:-8000}/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pluginlake"]

  dashboard-datastation:
    build:
      context: ../../
      dockerfile: deploy/docker/dashboard-datastation.Dockerfile
    ports:
      - "8501:8501"
    environment:
      DASHBOARD_API_URL: http://pluginlake:8000
    depends_on:
      pluginlake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 3


  # ---------------------------------------------------------------------------
  # Monitoring (profile `monitoring`, ADR-010). Enabled via [monitoring] in
  # pluginlake.toml, or manually with `--profile monitoring`. Only Prometheus is
  # published, on loopback; the exporters and the API metrics port stay internal.
  # ---------------------------------------------------------------------------
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [monitoring]
    entrypoint: ["/bin/sh", "/etc/prometheus/pluginlake/entrypoint.sh"]
    env_file:
      # Remote-write settings and credentials; read by Prometheus only. See .env.monitoring.example.
      - path: .env.monitoring
        required: false
    environment:
      PROMETHEUS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks: [default, monitoring]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus:/etc/prometheus/pluginlake:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    command:
      # Per-table collectors would turn table names into labels; table names can
      # derive from uploaded files, so they stay off.
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    env_file:
      # DATA_SOURCE_USER / DATA_SOURCE_PASS; prefer a dedicated user with the pg_monitor role.
      # Separate from .env.monitoring so neither service sees the other's secrets.
      - path: .env.postgres-exporter
        required: false
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [monitoring]
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # Container labels can hold anything; only keep the compose ones Prometheus filters on.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    # Read access to /dev/kmsg only, instead of `privileged` (same as vantage6-ops).
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    # cAdvisor can reach the Docker socket; keep its unauthenticated API off the app network.
    networks: [monitoring]
    restart: unless-stopped

networks:
  # Only Prometheus and cAdvisor; app containers cannot reach cadvisor:8080.
  monitoring:

volumes:
  dagster-postgres:
  dagster-compute-logs:
  pluginlake-data:
  prometheus-data:
