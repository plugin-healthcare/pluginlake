services:
  postgres:
    image: dhi.io/postgres:17-alpine3.22
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pluginlake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pluginlake}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  dagster-webserver:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster.Dockerfile
    restart: unless-stopped
    user: "${PUID:?PUID must be set}:${PGID:?PGID must be set}"
    environment:
      HOME: /app
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: ${POSTGRES_USER:-pluginlake}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    volumes:
      - ${PLUGINLAKE_CONFIG_DIR:?PLUGINLAKE_CONFIG_DIR must be set}/dagster.yaml:/app/config/dagster/dagster.yaml:ro
      - ${PLUGINLAKE_CONFIG_DIR}/workspace.yaml:/app/config/dagster/workspace.yaml:ro
      - ${PLUGINLAKE_STATE_DIR:?PLUGINLAKE_STATE_DIR must be set}/logs/compute:/app/compute_logs
      - ${PLUGINLAKE_STATE_DIR}/logs/dagster:/app/config/dagster/logs
      - ${PLUGINLAKE_STATE_DIR}/dagster:/app/.dagster
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command:
      [
        "dagster-webserver",
        "-h", "0.0.0.0",
        "-p", "3000",
        "-w", "/app/config/dagster/workspace.yaml",
      ]

  dagster-daemon:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster.Dockerfile
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      HOME: /app
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: ${POSTGRES_USER:-pluginlake}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - ${PLUGINLAKE_CONFIG_DIR}/dagster.yaml:/app/config/dagster/dagster.yaml:ro
      - ${PLUGINLAKE_CONFIG_DIR}/workspace.yaml:/app/config/dagster/workspace.yaml:ro
      - ${PLUGINLAKE_STATE_DIR}/logs/compute:/app/compute_logs
      - ${PLUGINLAKE_STATE_DIR}/logs/dagster:/app/config/dagster/logs
      - ${PLUGINLAKE_STATE_DIR}/dagster:/app/.dagster
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command: ["dagster-daemon", "run", "-w", "/app/config/dagster/workspace.yaml"]

  dagster-code-server:
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${CODE_SERVER_PORT:-4000}:4000"
    environment:
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: ${POSTGRES_USER:-pluginlake}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_USER: ${POSTGRES_USER:-pluginlake}
      DUCKLAKE_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    volumes:
      - ${PLUGINLAKE_CONFIG_DIR}/dagster.yaml:/app/config/dagster/dagster.yaml:ro
      - ${PLUGINLAKE_CONFIG_DIR}/workspace.yaml:/app/config/dagster/workspace.yaml:ro
      - ${PLUGINLAKE_DATA_DIR:?PLUGINLAKE_DATA_DIR must be set}/storage:/app/.data
      - ${PLUGINLAKE_STATE_DIR}/logs/compute:/app/compute_logs
      - ${PLUGINLAKE_STATE_DIR}/logs/dagster:/app/config/dagster/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',4000),2); s.close()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "dagster", "code-server", "start",
        "-h", "0.0.0.0",
        "-p", "4000",
        "-m", "pluginlake.definitions",
      ]

  pluginlake:
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      PLUGINLAKE_SERVER_HOST: "0.0.0.0"
      PLUGINLAKE_SERVER_PORT: ${PLUGINLAKE_SERVER_PORT:-8000}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_USER: ${POSTGRES_USER:-pluginlake}
      DUCKLAKE_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_INGEST_DAGSTER_WEBSERVER_URL: http://dagster-webserver:3000
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    ports:
      - "${PLUGINLAKE_SERVER_PORT:-8000}:${PLUGINLAKE_SERVER_PORT:-8000}"
    volumes:
      - ${PLUGINLAKE_DATA_DIR}/storage:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PLUGINLAKE_SERVER_PORT:-8000}/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pluginlake"]

  dashboard-datastation:
    build:
      context: ../../
      dockerfile: deploy/docker/ui-datastation.Dockerfile
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "8501:8501"
    profiles: [ui]
    environment:
      DASHBOARD_API_URL: http://pluginlake:${PLUGINLAKE_SERVER_PORT:-8000}
    depends_on:
      pluginlake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
