# Credentials are Docker secrets (docs/guides/docker.md#secrets). Compose reads them
# from deploy/compose/.env.production.secrets, which is never loaded into a container,
# and copies each to /run/secrets/<name> (mode 0400, owned by the service user).
# pluginlake reads them through its pydantic settings (secrets_dir); postgres and
# postgres-exporter through <VAR>_FILE; Dagster through the dagster_env launcher.
# Start with: just up  (passes --env-file .env.production --env-file .env.production.secrets)

# Rotate container logs: the default json-file driver keeps them unbounded on the host.
# Step stdout/stderr (dagster-code-server) can contain data, so keep the retention small.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: dhi.io/postgres:17-alpine3.24
    env_file: .env.production
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        uid: "70"
        gid: "70"
        mode: 0400
    ports:
      - "5432:5432"
    volumes:
      - dagster-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  dagster-webserver:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      DAGSTER_HOME: /app/config/dagster
    secrets:
      - source: dagster_pg_password
        uid: "65532"
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command:
      [
        "dagster-webserver",
        "-h", "0.0.0.0",
        "-p", "3000",
        "-w", "/app/config/dagster/workspace.yaml",
      ]

  dagster-daemon:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: deploy/docker/dagster-webserver.Dockerfile
    env_file: .env.production
    environment:
      DAGSTER_HOME: /app/config/dagster
    secrets:
      - source: dagster_pg_password
        uid: "65532"
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    command: ["dagster-daemon", "run", "-w", "/app/config/dagster/workspace.yaml"]

  dagster-code-server:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    ports:
      - "4000:4000"
    env_file: .env.production
    environment:
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    secrets:
      - source: ducklake_pg_password
        uid: "65532"
        mode: 0400
      # Runs execute in this container and write their events to the Dagster instance.
      - source: dagster_pg_password
        uid: "65532"
        mode: 0400
    volumes:
      - pluginlake-data:/app/.data
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 3s
      timeout: 3s
      start_period: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "python", "-m", "pluginlake.deploy.dagster_env",
        "dagster", "code-server", "start",
        "-h", "0.0.0.0",
        "-p", "4000",
        "-m", "pluginlake.definitions",
      ]

  pluginlake:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.Dockerfile
    env_file: .env.production
    environment:
      PLUGINLAKE_SERVER_HOST: ${PLUGINLAKE_SERVER_HOST:-0.0.0.0}
      PLUGINLAKE_SERVER_PORT: ${PLUGINLAKE_SERVER_PORT:-8000}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_INGEST_DAGSTER_WEBSERVER_URL: http://dagster-webserver:3000
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
      PLUGINLAKE_METRICS_HOST: "0.0.0.0"
    secrets:
      - source: ducklake_pg_password
        uid: "65532"
        mode: 0400
    ports:
      - "${PLUGINLAKE_SERVER_PORT:-8000}:${PLUGINLAKE_SERVER_PORT:-8000}"
    expose:
      # Internal metrics port (PLUGINLAKE_METRICS_PORT): scraped by Prometheus, never published.
      - "9464"
    volumes:
      - pluginlake-data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PLUGINLAKE_SERVER_PORT:-8000}/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pluginlake"]

  dashboard-datastation:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: deploy/docker/dashboard-datastation.Dockerfile
    ports:
      - "${DASHBOARD_HOST_PORT:-8501}:8501"
    environment:
      DASHBOARD_API_URL: http://pluginlake:8000
    depends_on:
      pluginlake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 3


  # ---------------------------------------------------------------------------
  # Monitoring (profile `monitoring`, ADR-010). Enabled via [monitoring] in
  # pluginlake.toml, or manually with `--profile monitoring`. Only Prometheus is
  # published, on loopback; the exporters and the API metrics port stay internal.
  # ---------------------------------------------------------------------------
  prometheus:
    logging: *default-logging
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    profiles: [monitoring]
    entrypoint: ["/bin/sh", "/etc/prometheus/pluginlake/entrypoint.sh"]
    env_file:
      # Remote-write URL and username; read by Prometheus only. See .env.monitoring.example.
      - path: .env.monitoring
        required: false
    environment:
      PROMETHEUS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    secrets:
      # Referenced directly as basic_auth.password_file; may be empty without remote write.
      - source: prometheus_remote_write_password
        uid: "65534"
        mode: 0400
    networks: [default, monitoring]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus:/etc/prometheus/pluginlake:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    logging: *default-logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    command:
      # Per-table collectors would turn table names into labels; table names can
      # derive from uploaded files, so they stay off.
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      # Prefer a dedicated user with the pg_monitor role (docs/guides/monitoring.md).
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-monitoring}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    secrets:
      - source: postgres_exporter_password
        uid: "65534"
        mode: 0400
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    logging: *default-logging
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [monitoring]
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # Container labels can hold anything; only keep the compose ones Prometheus filters on.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    # Read access to /dev/kmsg only, instead of `privileged` (same as vantage6-ops).
    # If container metrics are missing on a host, see docs/guides/monitoring.md.
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    # cAdvisor can reach the Docker socket; keep its unauthenticated API off the app network.
    networks: [monitoring]
    restart: unless-stopped

networks:
  # Only Prometheus and cAdvisor; app containers cannot reach cadvisor:8080.
  monitoring:

secrets:
  # Values come from the compose environment (.env.production.secrets), never from a container env file.
  postgres_password:
    environment: POSTGRES_PASSWORD
  dagster_pg_password:
    environment: DAGSTER_PG_PASSWORD
  ducklake_pg_password:
    environment: DUCKLAKE_PG_PASSWORD
  postgres_exporter_password:
    environment: POSTGRES_EXPORTER_PASSWORD
  prometheus_remote_write_password:
    environment: PROMETHEUS_REMOTE_WRITE_PASSWORD

volumes:
  dagster-postgres:
  pluginlake-data:
  prometheus-data:
