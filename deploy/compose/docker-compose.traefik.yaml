# Traefik reverse proxy for TLS termination (Nuts + FastAPI routing)
# Used as a compose overlay: docker compose -f ... -f docker-compose.traefik.yaml up
#
# Routes:
#   https://nuts-hub.localhost     → nuts-hub:8080
#   https://nuts-station.localhost → nuts-station:8080
#
# Generate certs first: ./scripts/generate-dev-certs.sh
services:
  traefik:
    image: traefik:v3.4
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:8888:8080"
    volumes:
      - ../../config/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ../../config/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ../../.data/traefik/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/overview"]
      interval: 5s
      timeout: 3s
      retries: 5
