services:
  postgres:
    image: dhi.io/postgres:17-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA:-../../.data/postgres}:/var/lib/postgresql/data
    env_file:
      - ${PLUGINLAKE_ENV_FILE:-../../.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  dagster:
    build:
      context: ../../
      dockerfile: deploy/docker/dagster.dev.Dockerfile
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /app/config/dagster
      DAGSTER_MODULE: ${DAGSTER_MODULE:-pluginlake.definitions}
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-${POSTGRES_USER}}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-${POSTGRES_PASSWORD}}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      PLUGINLAKE_ENSURE_DB: ${DAGSTER_PG_DB:-dagster}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_USER: ${DUCKLAKE_PG_USER:-${POSTGRES_USER}}
      DUCKLAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:-${POSTGRES_PASSWORD}}
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    env_file:
      - ${PLUGINLAKE_ENV_FILE:-../../.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../src:/app/src
      - ../../examples:/app/examples
      - ../../config/dagster:/app/config/dagster
      - ${PLUGINLAKE_DATA:-../../.data}:/app/.data
      - ${DAGSTER_COMPUTE_LOGS:-../../.data/dagster/compute_logs}:/app/compute_logs

  pluginlake:
    build:
      context: ../../
      dockerfile: deploy/docker/pluginlake.dev.Dockerfile
    env_file:
      - ${PLUGINLAKE_ENV_FILE:-../../.env}
    depends_on:
      postgres:
        condition: service_healthy
      dagster:
        condition: service_started
    environment:
      PLUGINLAKE_SERVER_HOST: ${PLUGINLAKE_SERVER_HOST:-0.0.0.0}
      PLUGINLAKE_SERVER_PORT: ${PLUGINLAKE_SERVER_PORT:-8000}
      PLUGINLAKE_DEBUG: ${PLUGINLAKE_DEBUG:-True}
      DUCKLAKE_PG_HOST: postgres
      DUCKLAKE_PG_PORT: "5432"
      DUCKLAKE_PG_USER: ${DUCKLAKE_PG_USER:-${POSTGRES_USER}}
      DUCKLAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:-${POSTGRES_PASSWORD}}
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      PLUGINLAKE_INGEST_DAGSTER_WEBSERVER_URL: http://dagster:3000
      PLUGINLAKE_INGEST_MAX_FILE_SIZE_MB: ${PLUGINLAKE_INGEST_MAX_FILE_SIZE_MB:-2000}
      PLUGINLAKE_STORAGE_BASE_DIR: .data/storage
    ports:
      - "${PLUGINLAKE_SERVER_PORT:-8000}:${PLUGINLAKE_SERVER_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${PLUGINLAKE_SERVER_PORT:-8000}/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ../../src:/app/src
      - ${PLUGINLAKE_DATA:-../../.data}:/app/.data

  pluginlake-ui:
    build:
      context: ../../
      dockerfile: deploy/docker/ui-datastation.dev.Dockerfile
    ports:
      - "8501:8501"
    environment:
      DASHBOARD_API_URL: http://pluginlake:${PLUGINLAKE_SERVER_PORT:-8000}
      DASHBOARD_DATASTATION_ID: ${DASHBOARD_DATASTATION_ID:-ds-local-001}
      DASHBOARD_DATASTATION_NAME: ${DASHBOARD_DATASTATION_NAME:-demo-1}
    depends_on:
      pluginlake:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - ../../src/pluginlake-ui/datastation:/app/src/pluginlake-ui/datastation
      - ../../assets:/app/assets:ro

  # --- Lineage (profile `lineage`, ADR-007) ---
  # OpenLineage endpoint inside the compose network: http://marquez:5000/api/v1/lineage

  # Dedicated database, separate from the Dagster/DuckLake postgres.
  marquez-db:
    image: dhi.io/postgres:17-alpine3.22
    profiles: ["lineage"]
    environment:
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
      POSTGRES_DB: ${MARQUEZ_DB:-marquez}
    # Named volume at the image's PGDATA; it inherits the image's postgres ownership (uid 70).
    volumes:
      - marquez-db-data:/var/lib/postgresql/17/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARQUEZ_DB_USER:-marquez} -d ${MARQUEZ_DB:-marquez}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  marquez:
    image: marquezproject/marquez:0.51.1
    profiles: ["lineage"]
    environment:
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${MARQUEZ_DB:-marquez}
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
    # No published ports: only reachable for services on the compose network.
    volumes:
      - ../../config/marquez/marquez.yml:/opt/marquez/marquez.yml:ro
    depends_on:
      marquez-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    profiles: ["lineage"]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    # Loopback only: Marquez has no authentication, so admins reach it via the host (e.g. SSH tunnel).
    ports:
      - "127.0.0.1:${MARQUEZ_WEB_PORT:-3001}:3000"
    depends_on:
      marquez:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  marquez-db-data:
