services:
  postgres:
    volumes:
      - smoke-pgdata:/var/lib/postgresql/17/data

  dagster:
    volumes:
      - ./smoke.env:/app/.env
      - smoke-lakehouse:/app/.data/lakehouse
      - smoke-compute-logs:/app/compute_logs

  pluginlake:
    volumes:
      - ./smoke.env:/app/.env

volumes:
  smoke-pgdata:
  smoke-lakehouse:
  smoke-compute-logs:
