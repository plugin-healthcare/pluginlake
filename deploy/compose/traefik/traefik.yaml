# Traefik static configuration. `pluginlake setup` renders the routing into ${PLUGINLAKE_HOME}/traefik; the certificate is ${PLUGINLAKE_HOME}/tls/tls.yaml.

# Backends trust X-Auth-Request-* headers, so drop client headers that alias them.
global:
  aliasHeadersStrategy: delete

log:
  level: INFO
accessLog: {}
ping: {}

providers:
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
