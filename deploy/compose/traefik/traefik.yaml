# Traefik static configuration for the production compose.
# Routing lives in dynamic/ and is loaded by the file provider, so Traefik never needs the Docker socket.
# Without a configured certificate Traefik serves its self-signed default, which is fine for *.localhost.
# For real domains, add a certificatesResolvers block (Let's Encrypt) or a tls.certificates entry.

log:
  level: INFO
accessLog: {}
ping: {}

providers:
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
