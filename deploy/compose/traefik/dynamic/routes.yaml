# Routing for the pluginlake edge stack.
# Hostnames come from PLUGINLAKE_DOMAIN through the file provider templating.
# Every application host sits behind oauth2-proxy forward auth. Only the identity provider is public.
# Each application requires the Zitadel project role with its own name (allowed_groups); the bare domain redirects to the console, which is the start page.
# Marquez and Prometheus answer 502 while their compose profile is not running.

http:
  routers:
    zitadel-login:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`) && PathPrefix(`/ui/v2/login`)'
      service: zitadel-login
      priority: 250
    zitadel-root:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`) && Path(`/`)'
      service: zitadel-login
      middlewares: [zitadel-root-rewrite]
      priority: 400
    zitadel:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: zitadel-api
      priority: 100
    oauth2-proxy:
      entryPoints: [websecure]
      rule: '(Host(`{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`api.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`dagster.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`console.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`marquez.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`prometheus.{{ env "PLUGINLAKE_DOMAIN" }}`)) && PathPrefix(`/oauth2/`)'
      service: oauth2-proxy
      priority: 300
    root:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: console
      middlewares: [root-redirect]
    api:
      entryPoints: [websecure]
      rule: 'Host(`api.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: api
      middlewares: [sso-errors, sso-auth-api]
    dagster:
      entryPoints: [websecure]
      rule: 'Host(`dagster.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: dagster
      middlewares: [sso-starting, sso-errors, sso-forbidden, sso-auth-dagster]
    console:
      entryPoints: [websecure]
      rule: 'Host(`console.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: console
      middlewares: [sso-starting, sso-errors, sso-forbidden, sso-auth-console]
    marquez:
      entryPoints: [websecure]
      rule: 'Host(`marquez.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: marquez
      middlewares: [sso-starting, sso-errors, sso-forbidden, sso-auth-marquez]
    prometheus:
      entryPoints: [websecure]
      rule: 'Host(`prometheus.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: prometheus
      middlewares: [sso-starting, sso-errors, sso-forbidden, sso-auth-prometheus]

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: "h2c://zitadel-api:8080"
    zitadel-login:
      loadBalancer:
        servers:
          - url: "http://zitadel-login:3000"
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
    starting-page:
      loadBalancer:
        servers:
          - url: "http://starting-page:8080"
    api:
      loadBalancer:
        servers:
          - url: "http://pluginlake:8000"
    dagster:
      loadBalancer:
        servers:
          - url: "http://dagster-webserver:3000"
    console:
      loadBalancer:
        servers:
          - url: "http://dashboard-datastation:8501"
    marquez:
      loadBalancer:
        servers:
          - url: "http://marquez-web:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

  middlewares:
    root-redirect:
      redirectRegex:
        regex: '^https://[^/]+/.*'
        replacement: 'https://console.{{ env "PLUGINLAKE_DOMAIN" }}/'
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/
    sso-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-api:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=api"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-dagster:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=dagster"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-console:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=console"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-marquez:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=marquez"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-prometheus:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=prometheus"
        trustForwardHeader: true
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-errors:
      errors:
        status: ["401"]
        statusRewrites:
          "401": 302
        service: oauth2-proxy
        query: "/oauth2/sign_in"
    # Shown while the stack is still starting: Traefik is reachable before oauth2-proxy and the applications are.
    sso-starting:
      errors:
        status: ["500-599"]
        service: starting-page
        query: "/"
    # A signed-in user without the role is signed out, also at the identity provider, and lands on the login page.
    sso-forbidden:
      errors:
        status: ["403"]
        statusRewrites:
          "403": 302
        service: oauth2-proxy
        query: '/oauth2/sign_out?rd=https%3A%2F%2Fauth.{{ env "PLUGINLAKE_DOMAIN" }}%2Foidc%2Fv1%2Fend_session'
