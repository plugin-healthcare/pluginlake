# Routing for the pluginlake edge stack.
# Hostnames come from PLUGINLAKE_DOMAIN through the file provider templating.
# Every application host sits behind oauth2-proxy forward auth. Only the identity provider is public.
# Each application requires the Zitadel project role with its own name (allowed_groups); the start page is open to every signed-in user.
# Marquez and Prometheus answer 502 while their compose profile is not running.

http:
  routers:
    zitadel-login:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`) && PathPrefix(`/ui/v2/login`)'
      service: zitadel-login
      priority: 250
    zitadel-root:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`) && Path(`/`)'
      service: zitadel-login
      middlewares: [zitadel-root-rewrite]
      priority: 400
    zitadel:
      entryPoints: [websecure]
      rule: 'Host(`auth.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: zitadel-api
      priority: 100
    oauth2-proxy:
      entryPoints: [websecure]
      rule: '(Host(`{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`api.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`dagster.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`dashboard.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`marquez.{{ env "PLUGINLAKE_DOMAIN" }}`) || Host(`prometheus.{{ env "PLUGINLAKE_DOMAIN" }}`)) && PathPrefix(`/oauth2/`)'
      service: oauth2-proxy
      priority: 300
    hub:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: api
      middlewares: [hub-rewrite, sso-errors, sso-auth]
    api:
      entryPoints: [websecure]
      rule: 'Host(`api.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: api
      middlewares: [sso-errors, sso-auth-api]
    dagster:
      entryPoints: [websecure]
      rule: 'Host(`dagster.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: dagster
      middlewares: [sso-errors, sso-auth-dagster]
    dashboard:
      entryPoints: [websecure]
      rule: 'Host(`dashboard.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: dashboard
      middlewares: [sso-errors, sso-auth-dashboard]
    marquez:
      entryPoints: [websecure]
      rule: 'Host(`marquez.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: marquez
      middlewares: [sso-errors, sso-auth-marquez]
    prometheus:
      entryPoints: [websecure]
      rule: 'Host(`prometheus.{{ env "PLUGINLAKE_DOMAIN" }}`)'
      service: prometheus
      middlewares: [sso-errors, sso-auth-prometheus]

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: "h2c://zitadel-api:8080"
    zitadel-login:
      loadBalancer:
        servers:
          - url: "http://zitadel-login:3000"
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
    api:
      loadBalancer:
        servers:
          - url: "http://pluginlake:8000"
    dagster:
      loadBalancer:
        servers:
          - url: "http://dagster-webserver:3000"
    dashboard:
      loadBalancer:
        servers:
          - url: "http://dashboard-datastation:8501"
    marquez:
      loadBalancer:
        servers:
          - url: "http://marquez-web:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

  middlewares:
    hub-rewrite:
      replacePath:
        path: /hub
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/
    sso-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-api:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=api"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-dagster:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=dagster"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-dashboard:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=dashboard"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-marquez:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=marquez"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-auth-prometheus:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth?allowed_groups=prometheus"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Auth-Request-Access-Token
    sso-errors:
      errors:
        status: ["401"]
        statusRewrites:
          "401": 302
        service: oauth2-proxy
        query: "/oauth2/sign_in"
